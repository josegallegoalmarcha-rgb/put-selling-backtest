name: Run V0.2-A ROC5 Six Windows

on:
  push:
    branches: [main]
    paths:
      - "v02a_roc5_six_windows.py"
      - ".github/workflows/v02a_roc5_six_windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy requests yfinance

      - name: Run V0.2-A ROC5 research
        run: python v02a_roc5_six_windows.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Add V0.2-A ROC5 six-window research results"
            git push
          fi
